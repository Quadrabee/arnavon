name: Integration.

on:
  pull_request:
    branches:
      - "master"
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: act10ns/slack@v1
        with:
          status: starting
          channel: '#opensource-cicd'

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Linting
        id: linting
        run: make lint

      - name: Unit Tests
        id: unit-tests
        run: make test.unit

      # The integration suite builds a docker image; running it once is enough.
      - name: Integration Tests
        id: integration-tests
        if: matrix.node-version == '22.x'
        run: make test.integration

      - uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#opensource-cicd'
        if: always()
